[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-application-tracker"
version = "0.1.0"
description = "A small PostgreSQL-backed CLI for tracking job applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1,<4"]

[project.scripts]
job-tracker = "job_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_tracker = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
